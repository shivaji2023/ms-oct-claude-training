spring.application.name=task-api

# H2 in-memory database - no external DB needed for the training session
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

# NOTE: this is a demo-only secret. Never commit real secrets like this.
# Participants will see this flagged during the /security-review demo too.
app.jwt.secret=training-demo-secret-key-not-for-production-use-only
app.jwt.expiry-minutes=60
